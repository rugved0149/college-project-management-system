name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run build -w client
      - run: npm test -w server
      - run: node --check server/src/index.js
      - run: node --check server/src/config/database.js
      - run: node --check server/src/middleware/auth.js
      - run: node --check server/src/middleware/upload.js
      - run: node --check server/src/routes/auth.js
      - run: node --check server/src/routes/projects.js
      - run: node --check server/src/routes/work.js
      - run: node --check server/src/routes/admin.js
      - run: node --check server/src/routes/notifications.js
      - run: node --check server/src/repositories/projectRepository.js
      - run: node --check server/src/repositories/workRepository.js
      - run: node --check server/src/services/auditService.js
      - run: node --check server/src/services/projectService.js
      - run: node --check server/src/services/workService.js
      - run: node --check server/src/domain/constants.js
      - run: node --check server/src/domain/projectLifecycle.js
      - run: node --check server/src/seed.js
