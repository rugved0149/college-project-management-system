services:
  - type: web
    name: campusflow-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm run seed -w server && npm run start -w server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: JWT_SECRET
        generateValue: true
      - key: DB_PATH
        value: ./server/storage/college_projects.db
      - key: UPLOAD_DIR
        value: ./server/storage/uploads
      - key: CLIENT_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: INITIAL_ADMIN_NAME
        value: CampusFlow Administrator
      - key: INITIAL_ADMIN_EMAIL
        value: admin@campusflow.demo
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_FROM_NAME
        value: CampusFlow
      - key: REQUIRE_MALWARE_SCAN
        value: 'false'
  - type: web
    name: campusflow-client
    runtime: static
    buildCommand: npm install && npm run build -w client
    staticPublishPath: client/dist
    envVars:
      - key: VITE_API_URL
        sync: false
