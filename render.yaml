services:
  - type: web
    name: campusflow-api
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm run start -w server
    healthCheckPath: /api/health
    disk:
      name: campusflow-data
      mountPath: /opt/render/project/src/server/storage
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: JWT_SECRET
        generateValue: true
      - key: DB_PATH
        value: /opt/render/project/src/server/storage/college_projects.db
      - key: CLIENT_URL
        sync: false
  - type: web
    name: campusflow-client
    runtime: static
    buildCommand: npm install && npm run build -w client
    staticPublishPath: client/dist
    envVars:
      - key: VITE_API_URL
        sync: false
